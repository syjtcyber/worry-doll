<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안개숲 걱정인형</title>
<style>
:root{
  --night:#0f1114;
  --night2:#17191f;
  --paper:#ddd5c5;
  --ink:#eee9df;
  --muted:#9f9b95;
  --gold:#b7a170;
  --line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  color:var(--ink);
  font-family:"Courier New","Malgun Gothic",monospace;
  background:
    radial-gradient(circle at 50% -12%,rgba(126,139,155,.18),transparent 43%),
    linear-gradient(180deg,var(--night),var(--night2));
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:18px 10px 54px;
}
.fog{
  position:fixed; inset:0; pointer-events:none;
  background:
    radial-gradient(circle at 10% 35%,rgba(215,220,226,.09),transparent 35%),
    radial-gradient(circle at 90% 68%,rgba(200,205,212,.07),transparent 38%);
  filter:blur(30px);
}
.rain-visual{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:.16}
.rain-line{
  position:absolute;top:-18vh;left:var(--x);width:1px;height:var(--h);
  background:linear-gradient(transparent,rgba(210,215,222,.46));
  transform:rotate(6deg);
  animation:rainFall var(--t) linear infinite;
  animation-delay:var(--d);
}
@keyframes rainFall{to{transform:translate(-20px,125vh) rotate(6deg)}}

.app{
  width:100%;max-width:470px;position:relative;
  background:rgba(25,27,32,.96);
  border:1px solid #625d57;
  border-radius:22px;
  padding:25px 18px 24px;
  box-shadow:0 24px 52px rgba(0,0,0,.64);
}
.header{text-align:center;margin-bottom:15px}
.title{
  margin:0;font-family:"바탕","Batang",serif;font-size:1.42rem;
  color:var(--paper);letter-spacing:2px
}
.sub{margin:8px 0 0;color:var(--muted);font-size:.74rem;line-height:1.7}
.rain-btn{
  margin:11px auto 0;padding:6px 12px;border-radius:999px;
  border:1px solid rgba(183,161,112,.35);
  background:rgba(0,0,0,.25);color:var(--gold);font:inherit;font-size:.69rem;cursor:pointer
}
.rain-btn.on{background:var(--gold);color:#131313;font-weight:700}

/* ---------- 무대 / 진짜 앉아 있는 레이어 ---------- */
.doll-stage{
  position:relative;height:245px;overflow:hidden;margin:5px 0 14px;
  border:1px solid rgba(130,135,142,.23);border-radius:18px;
  background:
    radial-gradient(circle at 50% 48%,rgba(195,201,210,.11),transparent 38%),
    linear-gradient(180deg,rgba(255,255,255,.01),rgba(0,0,0,.28));
}
.ground-shadow{
  position:absolute;z-index:0;left:50%;bottom:17px;
  width:205px;height:26px;transform:translateX(-50%);
  border-radius:50%;background:rgba(0,0,0,.52);filter:blur(7px)
}

/* 뒤쪽 나무: 인형 몸 뒤 */
.stump-back{
  position:absolute;z-index:1;left:50%;bottom:24px;
  width:188px;height:58px;transform:translateX(-50%);
  border-radius:52% 52% 34% 34%;
  background:
    radial-gradient(ellipse at 50% 23%,#79644f 0 12%,#624f3f 43%,#46382e 76%),
    #4a3a30;
  border:2px solid #392e27;
  box-shadow:inset 0 3px 0 rgba(220,195,160,.12)
}
.stump-back::before{
  content:"";position:absolute;left:18px;right:18px;top:8px;height:16px;
  border:1px solid rgba(45,35,28,.48);border-radius:50%
}
.stump-back::after{
  content:"";position:absolute;left:25px;bottom:1px;width:32px;height:9px;
  border-radius:50%;background:#2e4634;box-shadow:82px 1px 0 #2a4131;opacity:.8
}

/* 인형은 나무 윗면과 겹치게 낮춤 */
.doll-wrap{
  position:absolute;z-index:2;left:50%;bottom:29px;
  width:146px;height:184px;transform:translateX(-50%);
  transform-origin:50% 68%;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.38))
}
.doll-svg{width:100%;height:100%;overflow:visible}

/* 앞쪽 나무 테두리: 배/엉덩이 일부를 가려서 '앉음'을 만듦 */
.stump-front{
  position:absolute;z-index:3;left:50%;bottom:23px;
  width:188px;height:26px;transform:translateX(-50%);
  border-radius:0 0 45% 45%;
  background:linear-gradient(180deg,rgba(86,68,54,.92),#44362d);
  border:0 solid #392e27;border-width:0 2px 2px;
  pointer-events:none
}
.stump-front::before{
  content:"";position:absolute;left:0;right:0;top:-6px;height:12px;
  border-radius:50%;border-bottom:1px solid rgba(37,29,24,.52)
}

.doll-stage.nodding .doll-wrap{animation:nodTwice .9s ease-in-out}
@keyframes nodTwice{
  0%{transform:translateX(-50%) rotate(0)}
  16%{transform:translateX(-50%) translateY(5px) rotate(6deg)}
  30%{transform:translateX(-50%) rotate(0)}
  46%{transform:translateX(-50%) translateY(5px) rotate(6deg)}
  62%,100%{transform:translateX(-50%) rotate(0)}
}

.doll-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}
.tab{
  padding:10px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.24);color:var(--muted);font:inherit;font-size:.69rem;cursor:pointer
}
.tab.active{border-color:var(--gold);color:var(--gold);background:rgba(183,161,112,.10);font-weight:700}
.role{display:block;margin-top:3px;font-size:.57rem;color:#807e7a}
.tab.active .role{color:#c8b88f}

.bubble{
  min-height:77px;margin-bottom:15px;padding:14px 15px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  border:1px solid rgba(183,161,112,.24);border-radius:14px;
  background:rgba(8,9,12,.70);color:var(--paper);font-size:.81rem;line-height:1.72
}
.form{display:grid;gap:10px}
.label{margin:3px 0 -3px;color:#c7c0b7;font-size:.68rem}
textarea,select{
  width:100%;border:1px solid rgba(255,255,255,.12);border-radius:12px;
  background:rgba(0,0,0,.33);color:var(--ink);font:inherit;font-size:.81rem;outline:none
}
textarea{min-height:88px;padding:12px;resize:vertical;line-height:1.6}
select{height:46px;padding:0 10px}
textarea:focus,select:focus{border-color:var(--gold)}
.btn{
  width:100%;padding:12px;border:1px solid var(--gold);border-radius:12px;
  background:rgba(183,161,112,.09);color:var(--gold);font:inherit;font-size:.8rem;
  font-weight:700;cursor:pointer
}
.btn:hover:not(:disabled){background:var(--gold);color:#111}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- 선택형 대화 ---------- */
.dialogue-step{
  display:none;margin-top:16px;padding-top:15px;border-top:1px dashed rgba(255,255,255,.10)
}
.dialogue-step.show{display:block}
.question-title{font-size:.72rem;color:#bdb7ad;margin-bottom:9px;line-height:1.6}
.choice-grid{display:grid;gap:8px}
.choice{
  width:100%;padding:11px 12px;text-align:left;border-radius:10px;
  border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.24);
  color:#d7d1c7;font:inherit;font-size:.76rem;line-height:1.45;cursor:pointer
}
.choice:hover,.choice.selected{border-color:var(--gold);background:rgba(183,161,112,.10);color:#e8ddc4}

.last-note{display:none;margin-top:14px}
.last-note.show{display:block}
.last-note textarea{min-height:78px}
.hint{font-size:.61rem;color:#777b82;line-height:1.55;margin-top:5px}

/* ---------- 편지 ---------- */
.letter{
  display:none;margin-top:18px;padding:20px 18px;border:1px solid rgba(183,161,112,.42);
  border-radius:8px;color:#403a34;
  background:
    repeating-linear-gradient(0deg,transparent 0 30px,rgba(90,80,66,.08) 30px 31px),
    linear-gradient(#dad2c1,#cdc3af);
  box-shadow:7px 9px 0 rgba(0,0,0,.14);transform:rotate(-.3deg)
}
.letter.show{display:block}
.letter-tag{font-size:.57rem;color:#766d61;letter-spacing:.09em;margin-bottom:8px}
.letter h2{margin:0 0 10px;font-family:"바탕","Batang",serif;font-size:1rem}
.letter p{margin:0;font-family:"바탕","Batang",serif;font-size:.89rem;line-height:1.88;word-break:keep-all}
.closure{
  margin-top:12px;padding-top:11px;border-top:1px dashed rgba(78,67,55,.25);
  font-family:"바탕","Batang",serif;font-size:.82rem;line-height:1.72;color:#5c5349
}

/* ---------- 보관 ---------- */
.archive{margin-top:21px;padding-top:16px;border-top:1px dashed rgba(255,255,255,.11)}
.archive-title{font-size:.71rem;color:var(--muted);letter-spacing:1px;margin-bottom:10px}
.worry-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:285px;overflow:auto}
.worry-item{
  position:relative;overflow:hidden;padding:10px 11px;border-radius:10px;
  border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.24);font-size:.75rem
}
.worry-top{display:flex;gap:10px;justify-content:space-between}
.worry-text{line-height:1.55;word-break:break-word}
.worry-date{font-size:.63rem;color:var(--muted);white-space:nowrap}
.worry-meta{margin-top:5px;color:#8d8a85;font-size:.62rem;line-height:1.5}
.saved-note{margin-top:7px;padding:7px 8px;border-left:2px solid rgba(183,161,112,.33);color:#aaa49a;font-size:.66rem;line-height:1.5}
.release-btn{
  width:100%;margin-top:9px;padding:8px;border-radius:8px;
  border:1px solid rgba(183,161,112,.28);background:rgba(183,161,112,.05);
  color:#b7a170;font:inherit;font-size:.66rem;cursor:pointer
}
.release-status{display:none;margin-top:9px;min-height:20px;text-align:center;color:#c9b98f;font-size:.69rem}
.release-status.show{display:block}
.worry-item.releasing{border-color:rgba(183,161,112,.32)}
.release-fade{animation:cardFade .8s ease forwards}
@keyframes cardFade{to{opacity:0;transform:translateY(-8px);filter:blur(4px)}}

/* 글자 가루 */
.dust-char{
  position:fixed;z-index:9999;pointer-events:none;color:#ddd5c5;
  font-family:"Courier New","Malgun Gothic",monospace;font-size:.75rem;line-height:1;
  text-shadow:0 0 7px rgba(220,212,196,.25);
  animation:dustFly var(--duration) cubic-bezier(.18,.72,.24,1) forwards;
  animation-delay:var(--delay)
}
@keyframes dustFly{
  0%{opacity:1;transform:translate(0,0) rotate(0) scale(1);filter:blur(0)}
  55%{opacity:.78}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.42);filter:blur(4px)}
}

/* 종이 날아가는 효과 */
.flying-paper{
  position:fixed;z-index:9998;left:50%;top:58%;
  width:88px;height:64px;pointer-events:none;
  border:1px solid rgba(183,161,112,.55);border-radius:5px;
  background:
    repeating-linear-gradient(0deg,transparent 0 13px,rgba(90,80,66,.10) 13px 14px),
    linear-gradient(#ded6c7,#cfc4b0);
  box-shadow:5px 8px 16px rgba(0,0,0,.28);
  transform:translate(-50%,-50%) rotate(-4deg);
  animation:paperFly 1.35s cubic-bezier(.18,.75,.24,1) forwards;
}
.flying-paper::before{
  content:"";position:absolute;left:13px;right:13px;top:17px;height:1px;
  background:rgba(77,67,55,.22);
  box-shadow:0 13px 0 rgba(77,67,55,.18),0 26px 0 rgba(77,67,55,.14);
}
@keyframes paperFly{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(-4deg) scale(.86)}
  18%{opacity:1}
  55%{transform:translate(calc(-50% + 44px),-175px) rotate(14deg) scale(.72)}
  100%{opacity:0;transform:translate(calc(-50% - 86px),-310px) rotate(-28deg) scale(.36)}
}

.note{margin-top:10px;text-align:center;color:#71757b;font-size:.6rem;line-height:1.55}
@media(max-width:480px){.app{padding:23px 14px 20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important}}
</style>
</head>
<body>
<div class="fog"></div>
<div id="rainVisual" class="rain-visual" aria-hidden="true"></div>

<main class="app">
  <header class="header">
    <h1 class="title">안개숲 걱정인형</h1>
    <p class="sub">
      혼자 들고 있던 걱정을 인형에게 건네보세요.<br>
      이유를 말해도, 그냥 맡겨도 괜찮습니다.
    </p>
    <button id="rainBtn" class="rain-btn" type="button">RAIN · OFF</button>
  </header>

  <section id="dollStage" class="doll-stage">
    <div class="ground-shadow"></div>
    <div class="stump-back"></div>
    <div class="doll-wrap">
      <svg id="dollSvg" class="doll-svg" viewBox="0 0 120 160"></svg>
    </div>
    <div class="stump-front"></div>
  </section>

  <div class="doll-tabs">
    <button class="tab active" data-doll="bear">STITCH<span class="role">해결형</span></button>
    <button class="tab" data-doll="rabbit">LONG EAR<span class="role">공감형</span></button>
    <button class="tab" data-doll="moon">MOON<span class="role">사색형</span></button>
  </div>

  <div id="bubble" class="bubble">
    "말이 정리되지 않아도 괜찮아. 오늘 맡기고 싶은 걱정을 건네줘."
  </div>

  <section class="form">
    <div class="label">고민 분야</div>
    <select id="categoryInput">
      <option value="relation">연애 · 인간관계</option>
      <option value="work">일 · 학업</option>
      <option value="money">돈 · 생활</option>
      <option value="health">건강 · 컨디션</option>
      <option value="future">미래 · 불안</option>
      <option value="self">나 자신 · 마음</option>
      <option value="other">기타</option>
    </select>

    <div class="label">숲에 맡길 걱정</div>
    <textarea id="worryInput" placeholder="지금 인형에게 건네고 싶은 걱정을 적어주세요."></textarea>

    <div class="label">이 고민을 나에게 준 이유는 뭐야?</div>
    <select id="reasonInput">
      <option value="talk">그냥 말해보고 싶었어</option>
      <option value="heavy">갖고 있기에는 너무 무거웠어</option>
    </select>

    <button id="feedBtn" class="btn" type="button">걱정을 인형에게 건네기</button>
  </section>

  <section id="dialogueStep" class="dialogue-step">
    <div id="questionTitle" class="question-title"></div>
    <div id="choiceGrid" class="choice-grid"></div>

    <div id="lastNote" class="last-note">
      <div class="label">추가로 먹일 말</div>
      <textarea id="lastNoteInput" placeholder="딱 하나만 더 먹이고 싶은 말이 있다면 적어주세요."></textarea>
      <div class="hint">
        추가 입력은 이번 버전에서 한 번만 가능합니다. 처음 걱정과 함께 보관됩니다.
      </div>
      <button id="sealBtn" class="btn" type="button" style="margin-top:10px">이 고민을 잠시 맡겨두기</button>
    </div>
  </section>

  <section id="letter" class="letter" aria-live="polite">
    <div id="letterTag" class="letter-tag">FROM THE DOLL</div>
    <h2>걱정인형이 남긴 말</h2>
    <p id="letterBody"></p>
    <div id="closure" class="closure"></div>
  </section>

  <section class="archive">
    <div class="archive-title">SEALED WORRIES</div>
    <ul id="worryList" class="worry-list"></ul>
  </section>

  <p class="note">
    이 버전은 AI 없이 작동합니다. 사용자가 고른 인형과 고민을 준 이유를 기준으로 다른 반응을 보여줍니다.
  </p>
</main>

<script>
// ---------- 가는 백색소음 계열 ----------
let audioContext, rainSource, rainGain, highpass, lowpass;
let rainOn=false;

function makeRainBuffer(){
  const sr=audioContext.sampleRate;
  const buffer=audioContext.createBuffer(1,sr*2.2,sr);
  const data=buffer.getChannelData(0);
  let prev=0;
  for(let i=0;i<data.length;i++){
    const white=Math.random()*2-1;
    prev=prev*.12+white*.88;
    data[i]=prev*.38;
  }
  return buffer;
}
function startRain(){
  if(!audioContext) audioContext=new (window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==="suspended") audioContext.resume();
  if(rainSource) return;
  rainSource=audioContext.createBufferSource();
  rainGain=audioContext.createGain();
  highpass=audioContext.createBiquadFilter();
  lowpass=audioContext.createBiquadFilter();
  rainSource.buffer=makeRainBuffer(); rainSource.loop=true;
  highpass.type="highpass"; highpass.frequency.value=850;
  lowpass.type="lowpass"; lowpass.frequency.value=6500;
  rainGain.gain.value=.04;
  rainSource.connect(highpass).connect(lowpass).connect(rainGain).connect(audioContext.destination);
  rainSource.start();
}
function stopRain(){if(rainSource){try{rainSource.stop()}catch(e){} rainSource=null}}
document.getElementById("rainBtn").addEventListener("click",function(){
  rainOn=!rainOn; this.classList.toggle("on",rainOn);
  this.textContent=rainOn?"RAIN · ON":"RAIN · OFF";
  rainOn?startRain():stopRain();
});

// ---------- 화면 비 ----------
const rainVisual=document.getElementById("rainVisual");
function buildRain(){
  const f=document.createDocumentFragment(), count=window.innerWidth<520?22:36;
  for(let i=0;i<count;i++){
    const s=document.createElement("span"); s.className="rain-line";
    s.style.setProperty("--x",`${Math.random()*100}%`);
    s.style.setProperty("--h",`${36+Math.random()*60}px`);
    s.style.setProperty("--t",`${1.6+Math.random()*2.5}s`);
    s.style.setProperty("--d",`${-Math.random()*4}s`);
    f.appendChild(s);
  }
  rainVisual.replaceChildren(f);
}
buildRain(); window.addEventListener("resize",buildRain);

// ---------- 인형 ----------
const skins={
bear:`
  <!-- 뒤쪽 귀 -->
  <ellipse cx="28" cy="31" rx="14" ry="14" fill="#685b52" stroke="#b7a170" stroke-width="2"/>
  <ellipse cx="92" cy="31" rx="14" ry="14" fill="#685b52" stroke="#b7a170" stroke-width="2"/>

  <!-- 몸은 먼저 그려서 머리 뒤로 들어가게 -->
  <ellipse cx="60" cy="105" rx="29" ry="24" fill="#685b52" stroke="#b7a170" stroke-width="2"/>

  <!-- 팔은 몸 아래쪽에 붙임 -->
  <ellipse cx="37" cy="108" rx="11" ry="7" fill="#584c44" transform="rotate(12 37 108)"/>
  <ellipse cx="83" cy="108" rx="11" ry="7" fill="#584c44" transform="rotate(-12 83 108)"/>

  <!-- 앉은 다리 -->
  <ellipse cx="39" cy="127" rx="17" ry="9" fill="#4a4039" transform="rotate(7 39 127)"/>
  <ellipse cx="81" cy="127" rx="17" ry="9" fill="#4a4039" transform="rotate(-7 81 127)"/>

  <!-- 큰 머리를 몸 위에 겹쳐 전면으로 -->
  <ellipse cx="60" cy="59" rx="47" ry="43" fill="#786a5e" stroke="#b7a170" stroke-width="2.5"/>

  <!-- 얼굴 -->
  <circle cx="43" cy="55" r="9" fill="#1e1c1a" stroke="#b7a170" stroke-width="1.5"/>
  <line x1="38" y1="50" x2="48" y2="60" stroke="#d8d0bf" stroke-width="2.4"/>
  <line x1="48" y1="50" x2="38" y2="60" stroke="#d8d0bf" stroke-width="2.4"/>

  <circle cx="77" cy="55" r="9" fill="#1e1c1a" stroke="#b7a170" stroke-width="1.5"/>
  <line x1="72" y1="50" x2="82" y2="60" stroke="#d8d0bf" stroke-width="2.4"/>
  <line x1="82" y1="50" x2="72" y2="60" stroke="#d8d0bf" stroke-width="2.4"/>

  <path d="M47 76 Q60 86 73 76" fill="none" stroke="#25201c" stroke-width="2"/>
`,
rabbit:`
  <!-- 긴 귀는 뒤 레이어 -->
  <path d="M29 44 C8 58 11 112 27 107 C34 100 37 62 39 48 Z"
        fill="#5f536c" stroke="#b7a170" stroke-width="2"/>
  <path d="M91 44 C112 58 109 112 93 107 C86 100 83 62 81 48 Z"
        fill="#5f536c" stroke="#b7a170" stroke-width="2"/>

  <!-- 몸 -->
  <ellipse cx="60" cy="105" rx="29" ry="24" fill="#554a61" stroke="#b7a170" stroke-width="2"/>

  <!-- 팔 -->
  <ellipse cx="37" cy="108" rx="11" ry="7" fill="#473d51" transform="rotate(12 37 108)"/>
  <ellipse cx="83" cy="108" rx="11" ry="7" fill="#473d51" transform="rotate(-12 83 108)"/>

  <!-- 다리 -->
  <ellipse cx="39" cy="127" rx="17" ry="9" fill="#3a3342" transform="rotate(7 39 127)"/>

function releaseTextAsDust(elem, options={}){
  if(!elem) return;

  const {
    stripPrefix=true,
    slower=false,
    extraDelay=0
  }=options;

  let raw=elem.textContent;

  if(stripPrefix){
    raw=raw.replace(/^🔒\s*/,"");
  }

  const rect=elem.getBoundingClientRect();
  const fs=parseFloat(getComputedStyle(elem).fontSize)||12;
  const cw=fs*.9;

  let x=rect.left;
  let y=rect.top;

  Array.from(raw).forEach((ch,i)=>{
    if(ch===" "){
      x+=cw*.7;
      return;
    }

    if(x+cw>rect.right){
      x=rect.left;
      y+=fs*1.55;
    }

    const s=document.createElement("span");
    s.className="dust-char";
    s.textContent=ch;
    s.style.left=`${x}px`;
    s.style.top=`${y}px`;

    const horizontal=slower ? 54 : 80;
    const minUp=slower ? 75 : 95;
    const extraUp=slower ? 110 : 155;

    s.style.setProperty("--dx",`${Math.random()*horizontal-horizontal/2}px`);
    s.style.setProperty("--dy",`${-(minUp+Math.random()*extraUp)}px`);
    s.style.setProperty("--rot",`${Math.random()*150-75}deg`);

    const charDelay=i*(slower?.038:.025)+Math.random()*.07+extraDelay;
    s.style.setProperty("--delay",`${charDelay}s`);

    const duration=slower
      ? 1.9+Math.random()*.9
      : 1.35+Math.random()*.8;

    s.style.setProperty("--duration",`${duration}s`);

    document.body.appendChild(s);
    setTimeout(()=>s.remove(),4300);

    x+=cw;
  });

  elem.style.visibility="hidden";
}
function releaseWorry(index,li){
  if(li.classList.contains("releasing"))return;

  li.classList.add("releasing");

  const btn=li.querySelector(".release-btn");
  const status=li.querySelector(".release-status");
  const txt=li.querySelector(".worry-text");
  const savedNote=li.querySelector(".last-saved-note");

  btn.style.display="none";
  status.classList.add("show");
  status.textContent="인형이 걱정을 받아 들었다.";

  setTimeout(()=>{
    status.textContent="냠.";
  },650);

  setTimeout(()=>{
    status.textContent="...냠냠.";
  },1200);

  // 본문이 먼저 가루가 되어 올라감
  setTimeout(()=>{
    status.textContent="걱정이 가루가 되어 흩어졌다.";
    releaseTextAsDust(txt,{
      stripPrefix:true,
      slower:false
    });
  },1800);

  // 마지막으로 남긴 말이 있다면 조금 늦고 느리게 따라 올라감
  if(savedNote){
    setTimeout(()=>{
      status.textContent="마지막으로 남긴 말도 천천히 따라갔다.";
      releaseTextAsDust(savedNote,{
        stripPrefix:false,
        slower:true
      });
    },2450);
  }

  const fadeAt=savedNote ? 3900 : 3100;
  const removeAt=savedNote ? 4700 : 3900;

  setTimeout(()=>{
    status.textContent="이제 여기에는 남아 있지 않아.";
    li.classList.add("release-fade");
  },fadeAt);

  setTimeout(()=>{
    worries.splice(index,1);
    localStorage.setItem(
      "mistWorriesChoiceDialogue",
      JSON.stringify(worries)
    );
    renderArchive();
  },removeAt);
}
function renderArchive(){
  worryList.innerHTML="";

    const li=document.createElement("li");li.className="worry-item";
    const top=document.createElement("div");top.className="worry-top";

    meta.textContent=`${personas[item.doll]?.name||"DOLL"} · ${categoryLabel} · ${reasonLabel}${item.choice?" · "+item.choice:""}`;

    const status=document.createElement("div");status.className="release-status";
    btn.addEventListener("click",()=>releaseWorry(index,li));
    li.append(btn,status);worryList.appendChild(li);
  });
}
