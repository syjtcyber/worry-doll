<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>안개숲 걱정인형</title>
<style>
  :root{
    --bg:#0b0f16;
    --panel:#111722;
    --panel2:#0c1018;
    --line:rgba(235,226,205,.16);
    --text:#eee8da;
    --muted:#a9a295;
    --gold:#d6b36e;
    --stitch:#243a66;
    --stitch2:#162846;
    --ear:#d58aa0;
    --ear2:#b96c85;
    --moon:#efd46f;
    --moon2:#ddbd50;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100svh;
    display:grid;
    place-items:center;
    background:
      radial-gradient(circle at 50% 12%, rgba(92,107,138,.28), transparent 34%),
      linear-gradient(180deg,#151923,#07090d 75%);
    color:var(--text);
    font-family: ui-monospace, Menlo, Consolas, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", monospace;
    padding:16px;
  }
  .app{
    width:min(94vw, 430px);
    aspect-ratio:1/1;
    max-height:94svh;
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:30px;
    background:
      radial-gradient(circle at 50% 44%, rgba(214,179,110,.11), transparent 27%),
      linear-gradient(180deg,#171d28 0%,#0b0f16 100%);
    box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 0 38px rgba(255,255,255,.03);
  }
  .app::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 18% 22%, rgba(255,255,255,.04), transparent 18%),
      radial-gradient(circle at 78% 55%, rgba(255,255,255,.025), transparent 20%);
    pointer-events:none;
  }
  header{
    position:absolute; left:20px; right:20px; top:18px;
    display:flex; align-items:center; justify-content:space-between;
    z-index:5;
  }
  h1{
    margin:0;
    font-size:clamp(23px, 7vw, 34px);
    letter-spacing:.04em;
    line-height:1;
  }
  .bottleBtn{
    border:1px solid var(--line);
    background:rgba(7,10,16,.68);
    color:var(--text);
    border-radius:999px;
    padding:9px 14px;
    font-size:14px;
    cursor:pointer;
  }
  .stage{
    position:absolute; inset:0;
    padding:74px 20px 20px;
    display:grid;
    grid-template-rows: 1fr auto;
    gap:10px;
    z-index:2;
  }
  .theater{
    position:relative;
    min-height:0;
    border:1px solid rgba(235,226,205,.13);
    border-radius:24px;
    background:
      radial-gradient(ellipse at 50% 78%, rgba(214,179,110,.18), transparent 26%),
      linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01));
    overflow:hidden;
  }
  .prompt{
    position:absolute; left:18px; right:18px; bottom:14px;
    text-align:center;
    color:#d8cfbd;
    font-size:clamp(15px,4vw,18px);
    line-height:1.35;
    z-index:8;
    text-shadow:0 2px 10px rgba(0,0,0,.7);
  }

  .doll{
    position:absolute; left:50%; top:49%;
    width:min(58vw, 210px); height:min(58vw, 210px);
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 18px 10px rgba(0,0,0,.35));
    transition:.28s ease;
    cursor:default;
    z-index:5;
    display:grid;
    place-items:center;
  }
  .doll img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
    transform-origin:50% 62%;
  }
  .doll.idle img{animation:softNod 2.8s ease-in-out infinite}
  .doll.nod img{animation:nodImg .72s ease-in-out 2}
  .doll.feedNod img{animation:feedNod .95s ease-in-out 1}
  @keyframes softNod{
    0%,100%{transform:rotate(0deg) translateY(0)}
    35%{transform:rotate(-2.2deg) translateY(-1px)}
    70%{transform:rotate(1.8deg) translateY(0)}
  }
  @keyframes nodImg{
    0%,100%{transform:rotate(0)}
    40%{transform:rotate(-5deg)}
    70%{transform:rotate(4deg)}
  }
  @keyframes feedNod{
    0%,100%{transform:scale(1) rotate(0)}
    35%{transform:scale(1.05) rotate(-3deg)}
    68%{transform:scale(.98) rotate(3deg)}
  }
  .plinth{position:absolute; left:50%; top:73%; transform:translateX(-50%); width:145px; height:26px; border-radius:50%; background:radial-gradient(ellipse,#6d4b33,#2c2019 70%); opacity:.78}
  .letter{
    position:absolute; left:50%; top:70%; width:62px; height:44px;
    transform:translate(-50%,-50%);
    background:#f3ead8; color:#2b261f;
    border-radius:8px;
    display:none; place-items:center;
    font-size:22px; z-index:6;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
  }
  .letter.show{display:grid}
  .letter.feed{display:grid; animation:feed 1.15s ease forwards}
  @keyframes feed{
    0%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    75%{opacity:.92; transform:translate(-50%,-170%) scale(.38)}
    100%{opacity:0; transform:translate(-50%,-185%) scale(.18)}
  }
  .panel{
    border:1px solid rgba(235,226,205,.13);
    border-radius:24px;
    background:rgba(7,10,16,.78);
    padding:14px;
    min-height:128px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px;
  }
  .panelTitle{font-size:18px; color:#d7cfbd; text-align:center; line-height:1.2}
  .tiny{font-size:12px; color:var(--muted); text-align:center; line-height:1.35}
  .row{display:flex; gap:9px; flex-wrap:wrap; justify-content:center; width:100%}
  button{
    border:1px solid rgba(235,226,205,.16);
    background:#131a27;
    color:var(--text);
    border-radius:18px;
    padding:12px 15px;
    font:inherit;
    font-size:15px;
    cursor:pointer;
  }
  button.primary{border-color:rgba(214,179,110,.62); background:rgba(99,76,34,.55); color:#f6e5bd}
  button.ghost{background:rgba(255,255,255,.04)}
  .dollPick{min-width:96px; padding:10px 8px; line-height:1.25}
  .dollPick b{display:block;font-size:13px;letter-spacing:.06em}.dollPick span{font-size:14px}
  textarea{
    width:100%; height:70px; resize:none; outline:none;
    border:1px solid rgba(235,226,205,.14);
    border-radius:16px;
    background:#0c111a; color:var(--text);
    padding:12px; font:inherit; font-size:14px; line-height:1.35;
  }
  .reply{
    width:100%; min-height:66px;
    display:grid; place-items:center;
    text-align:center; line-height:1.45;
    color:#efe6d1;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(235,226,205,.12);
    border-radius:16px;
    padding:12px;
    font-size:15px;
  }
  .footer{
    position:absolute; left:20px; right:20px; bottom:5px;
    text-align:center; font-size:10.5px; line-height:1.25; color:rgba(238,232,218,.48);
    z-index:6; pointer-events:none;
  }
  .hidden{display:none!important}
  .bottleList{width:100%; max-height:86px; overflow:auto; display:flex; flex-direction:column; gap:6px}
  .bottleItem{font-size:12px; color:#d8cfbd; background:rgba(255,255,255,.04); border:1px solid rgba(235,226,205,.1); border-radius:12px; padding:7px 9px; line-height:1.25}
  @media (max-width:380px){
    .app{width:96vw}.stage{padding:66px 14px 16px}.doll{transform:translate(-50%,-50%) scale(.9)}
    .panel{min-height:120px;padding:11px}.dollPick{min-width:82px;font-size:13px}button{padding:10px 12px;font-size:14px}
    h1{font-size:24px}.bottleBtn{font-size:12px;padding:8px 11px}
  }
</style>
</head>

let current='empathy';
let worry='';
let reason='';
const doll=document.getElementById('doll');
const dollImg=document.getElementById('dollImg');
const belly=document.getElementById('belly');
const panel=document.getElementById('panel');
const promptEl=document.getElementById('prompt');
const letter=document.getElementById('letter');
const countEl=document.getElementById('count');
const openBottle=document.getElementById('openBottle');
const KEY='mistWorryDollSquareV1';

function archive(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function saveArchive(list){localStorage.setItem(KEY,JSON.stringify(list)); updateCount();}
function updateCount(){countEl.textContent=archive().length}
function setDoll(key){
  current=key;
  const d=dolls[key];
  doll.className='doll idle';
  dollImg.src=d.img;
  dollImg.alt=d.alt;
  promptEl.textContent=d.prompt;
}
function nod(){doll.classList.remove('nod'); void doll.offsetWidth; doll.classList.add('nod'); setTimeout(()=>doll.classList.remove('nod'),1450)}
function feedNod(){doll.classList.remove('feedNod'); void doll.offsetWidth; doll.classList.add('feedNod'); setTimeout(()=>doll.classList.remove('feedNod'),1100)}
function cleanLetter(){letter.className='letter';}
function setPanel(html){panel.innerHTML=html}
function goSelect(){
  cleanLetter(); setDoll(current); promptEl.textContent='인형을 골라요.';
  setPanel(`<div class="panelTitle">누구에게 맡길까요?</div><div class="row">
    ${Object.entries(dolls).map(([k,d])=>`<button class="dollPick ${k===current?'primary':''}" data-pick="${k}"><b>${d.name}</b><span>${d.label}</span></button>`).join('')}
  </div>`);
  panel.querySelectorAll('[data-pick]').forEach(btn=>btn.onclick=()=>{setDoll(btn.dataset.pick); goInput();});
}
function goInput(){
  cleanLetter(); promptEl.textContent='걱정을 접어 건네요.';
  setPanel(`<textarea id="worryInput" maxlength="140" placeholder="지금 인형에게 건네고 싶은 걱정"></textarea><div class="row"><button class="ghost" id="back">다시 고르기</button><button class="primary" id="fold">편지 접기</button></div>`);
  document.getElementById('back').onclick=goSelect;
  document.getElementById('fold').onclick=()=>{
    const v=document.getElementById('worryInput').value.trim();
    if(!v){promptEl.textContent='한 줄만 적어도 괜찮아.'; return;}
    worry=v; goReason();
  };
}
function goReason(){
  cleanLetter(); letter.classList.add('show'); promptEl.textContent='왜 건네나요?';
  setPanel(`<div class="row"><button class="primary" data-reason="talk">말하고 싶어</button><button data-reason="heavy">너무 무거워</button></div>`);
  panel.querySelectorAll('[data-reason]').forEach(btn=>btn.onclick=()=>{reason=btn.dataset.reason; goFeed();});
}
function goFeed(){
  promptEl.textContent='인형이 편지를 먹고 있어요.';
  setPanel(`<div class="tiny">잠시만 기다려요.</div>`);
  letter.className='letter feed'; feedNod();
  setTimeout(goBelly,1250);
}
function goBelly(){
  cleanLetter(); belly.textContent='✉'; promptEl.textContent='배를 눌러 편지를 꺼내요.';
  setPanel(`<button class="primary" id="touchBelly">배 누르기</button>`);
  document.getElementById('touchBelly').onclick=goReply;
}
function response(){
  const r=reason;
  if(current==='action') return r==='talk' ? '말한 것만으로도 한 걸음이야.<br>숨을 길게 한 번 쉬어봐.' : '지금은 크게 풀지 않아도 돼.<br>손부터 천천히 펴보자.';
  if(current==='empathy') return r==='talk' ? '잘 말했어.<br>내가 여기서 들어줄게.' : '무거웠겠다.<br>여기까지 가져온 것도 애썼어.';
  return r==='talk' ? '말은 그림자를 밖에 세우는 일이야.<br>지금은 조금 멀어졌어.' : '건넨 순간 모양은 조금 변했어.<br>내려놓는 의식은 시작됐어.';
}
function goReply(){
  belly.textContent='♡'; letter.classList.add('show'); promptEl.textContent='편지가 나왔어요.';
  setPanel(`<div class="reply">${response()}</div><div class="row"><button id="fog">안개로 보내기</button><button class="primary" id="keep">병에 넣기</button></div>`);
  document.getElementById('keep').onclick=()=>{const list=archive(); list.unshift({doll:current, reason, worry, at:new Date().toLocaleString('ko-KR')}); saveArchive(list.slice(0,20)); promptEl.textContent='병에 넣어두었어요.'; nod(); setTimeout(reset,900);};
  document.getElementById('fog').onclick=()=>{promptEl.textContent='안개숲으로 보냈어요.'; letter.className='letter feed'; feedNod(); setTimeout(reset,1000);};
}
function reset(){worry='';reason='';belly.textContent='♡';goSelect();}
function goBottle(){
  cleanLetter(); promptEl.textContent='병에 든 편지';
  const list=archive();
  if(!list.length){setPanel(`<div class="panelTitle">아직 병이 비었어요.</div><button class="primary" id="closeBottle">닫기</button>`);}
  else{setPanel(`<div class="bottleList">${list.slice(0,5).map(item=>`<div class="bottleItem">${dolls[item.doll]?.label||'인형'} · ${item.worry.replace(/[<>]/g,'').slice(0,40)}</div>`).join('')}</div><div class="row"><button class="ghost" id="clearBottle">비우기</button><button class="primary" id="closeBottle">닫기</button></div>`); document.getElementById('clearBottle').onclick=()=>{saveArchive([]);goBottle();};}
  document.getElementById('closeBottle').onclick=goSelect;
}
openBottle.onclick=goBottle;
belly.onclick=()=>{ if(promptEl.textContent.includes('배를 눌러')) goReply(); };
updateCount(); goSelect();
</script>
</body>
</html>
